name: test and scan
on:
  push:
    branches: [main]
jobs:
  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [tasks-api, title-normalizer]
    steps:  
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - shell: bash 
        run: pytest -rA services/${{ matrix.service }} | tee ${{ matrix.service }}-test-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.service }}-test-report
          path: ${{ matrix.service }}-test-report.txt 

   

